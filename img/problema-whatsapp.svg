<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcff"/><stop offset="1" stop-color="#e9f2fa"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d27b"/><stop offset="1" stop-color="#0f8f56"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d3b66"/><stop offset="1" stop-color="#0b2a4a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b2a4a" flood-opacity=".2"/></filter>
    <filter id="sm" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a4a" flood-opacity=".16"/></filter>
    <clipPath id="pc"><rect x="170" y="36" width="300" height="288" rx="22"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="60" cy="310" r="95" fill="#1273b8" opacity=".06"/>
  <circle cx="600" cy="50" r="115" fill="#0f7f55" opacity=".07"/>

  <!-- burbujas sueltas -->
  <g filter="url(#sm)">
    <rect x="40" y="196" width="104" height="40" rx="14" fill="#fff"/>
    <rect x="498" y="236" width="102" height="40" rx="14" fill="#fff4e6"/>
  </g>
  <text x="92" y="221" text-anchor="middle" font-size="13" fill="#0b2a4a">¿Ya llegó?</text>
  <text x="549" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#b85c00">¡Urgente!</text>

  <!-- panel de chat -->
  <rect x="170" y="36" width="300" height="288" rx="22" fill="#fff" filter="url(#sh)"/>
  <g clip-path="url(#pc)">
    <rect x="170" y="36" width="300" height="68" fill="url(#hd)"/>
    <rect x="170" y="104" width="300" height="220" fill="#eef3f7"/>
  </g>
  <text x="222" y="66" font-size="15" font-weight="700" fill="#fff">Grupo Mantenimiento</text>
  <text x="222" y="86" font-size="12" fill="#a9c1d8">+99 mensajes sin leer</text>

  <!-- mensajes -->
  <g filter="url(#sm)">
    <rect x="190" y="120" width="196" height="38" rx="12" fill="#fff"/>
    <rect x="190" y="168" width="130" height="34" rx="12" fill="#fff"/>
    <rect x="290" y="212" width="160" height="34" rx="12" fill="#d9fdd3"/>
    <rect x="190" y="256" width="116" height="34" rx="12" fill="#fff"/>
  </g>
  <g font-size="13" fill="#0b2a4a">
    <text x="204" y="144">Se dañó el aire, local 12</text>
    <text x="204" y="190">¿Alguien lo vio?</text>
    <text x="304" y="234">Ya le aviso al técnico</text>
    <text x="204" y="278">¿Y las fotos?</text>
  </g>

  <!-- icono verde (mismo glifo del sitio) -->
  <circle cx="170" cy="52" r="36" fill="url(#gr)" stroke="#fff" stroke-width="6" filter="url(#sh)"/>
  <g transform="translate(170 52) scale(1.75) translate(-12 -12)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 20.5l1.4-4.2A8.5 8.5 0 118 19.3z"/>
    <path d="M9 9c0 3 3 6 6 6l1.2-1.4-2-1-1 .8c-.8-.3-1.9-1.4-2.2-2.2l.8-1-1-2z"/>
  </g>

  <!-- contador -->
  <circle cx="470" cy="40" r="21" fill="#e5484d" stroke="#fff" stroke-width="4" filter="url(#sm)"/>
  <text x="470" y="45" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">99+</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
