  <!-- DESPUÉS -->
  <rect x="340" y="56" width="210" height="170" rx="16" fill="#fff" stroke="#f28c28" stroke-width="2.5" stroke-dasharray="8 7" filter="url(#sm)"/>
  <rect x="356" y="70" width="92" height="24" rx="12" fill="#eaf3fb"/>
  <text x="402" y="87" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#0b2a4a">DESPUÉS</text>
  <use href="#foto" x="340" y="62"/>

  <!-- flecha -->
  <circle cx="320" cy="141" r="20" fill="#fff" filter="url(#sm)"/>
  <path d="M312 141h16M322 134l7 7-7 7" fill="none" stroke="#1273b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- alerta -->
