<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="system-ui,'Segoe UI',Roboto,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcff"/><stop offset="1" stop-color="#e9f2fa"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7a853"/><stop offset="1" stop-color="#f28c28"/></linearGradient>
    <filter id="sm" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b2a4a" flood-opacity=".16"/></filter>
    <g id="foto">
      <circle cx="80" cy="65" r="11" fill="#d3dee9"/>
      <path d="M50 130 L85 90 L105 110 L125 80 L160 130 Z" fill="#d3dee9"/>
      <path d="M60 50 L150 145" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      <path d="M60 50 L150 145" stroke="#f28c28" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="580" cy="320" r="110" fill="#f28c28" opacity=".08"/>
  <circle cx="50" cy="40" r="90" fill="#1273b8" opacity=".06"/>

  <!-- ANTES -->
  <rect x="90" y="56" width="210" height="170" rx="16" fill="#fff" stroke="#f28c28" stroke-width="2.5" stroke-dasharray="8 7" filter="url(#sm)"/>
  <rect x="106" y="70" width="70" height="24" rx="12" fill="#eaf3fb"/>
  <text x="141" y="87" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#0b2a4a">ANTES</text>
